budget:
  currency: "ريال"
  monthlyTotal: 9500
  # الحد الأدنى لميزانية الحملة اليومية على كل منصة — دونه لا تخرج الحملة من مرحلة التعلّم
  minDailyBudget:
    linkedin: 40
    meta: 20
    tiktok: 20
    snapchat: 20
  allocation:
    linkedin: 3000
    meta: 2500
    tiktok: 1200
    snapchat: 1000
    retargeting: 800
    reserve: 1000

# قواعد الإيقاف التلقائي — محرك التحسين ينفذها يوميًا
optimizer:
  # إعلان أنفق هذا المبلغ بلا عميل محتمل واحد يُوقف
  spendNoLeadThreshold: 500
  # إعلان تجاوزت تكلفة عميله المحتمل ضعف متوسط القناة يُوقف
  cplMultiplierCap: 2.0
  # لا يُقيّم إعلان قبل مرور هذه المدة
  minAgeDays: 7
  # أقصى زيادة في ميزانية إعلان خلال 3 أيام
  maxBudgetIncreasePct: 20
  budgetChangeCooldownDays: 3
  # قناة بلا عميل محتمل مؤهل خلال 30 يومًا تُخفَّض ميزانيتها
  channelReviewDays: 30
  channelBudgetCutPct: 70

leadScoring:
  # تأهيل العميل المحتمل: 60 نقطة فأعلى = مؤهل
  qualifiedThreshold: 60
  hotThreshold: 80
  units:
    "أقل من 10": 10
    "10 – 50": 30
    "51 – 150": 45
    "أكثر من 150": 50
  propertyType:
    "مجمع تجاري": 25
    "مبنى مكتبي": 25
    "مجمع سكني": 20
    "وحدات متفرقة": 12
    "عقار فندقي / ضيافة": 22
    "أرض أو مشروع تحت التطوير": 18
  sourceBonus:
    linkedin: 20
    landing: 15
    instagram: 10
    tiktok: 6
    snapchat: 6
    whatsapp: 12
    referral: 25

approvals:
  # الموافقة البشرية مطلوبة قبل أي نشر
  required: true
  # موعد إرسال طلب الموافقة اليومي
  digestTime: "08:00"
  # يُلغى المنشور غير المعتمد بعد هذه المدة
  expireHours: 36
  # المحتوى يُولَّد قبل موعد نشره بهذا العدد من الأيام
  generateLeadDays: 3

reports:
  dailyTime: "21:30"
  weeklyDay: 0        # الأحد
  weeklyTime: "08:30"

sla:
  # الحد الأقصى لزمن الرد الأول على عميل محتمل (دقائق)
  firstResponseMinutes: 120
