# ═══════════════════════════════════════════════════════════
#  تقويم المحتوى — 12 أسبوعًا
#  المخطِّط (planner) يوزّع هذه المواضيع على أيام النشر لكل قناة.
# ═══════════════════════════════════════════════════════════

# نسب أنواع المحتوى — يلتزم بها المولّد
mix:
  educational: 0.60   # تعليمي
  proof: 0.25         # إثبات ونتائج
  promotional: 0.15   # ترويج مباشر

phases:
  - id: awareness
    name: "التأسيس والوعي"
    weeks: [1, 2, 3, 4]
    goal: "طرح المشكلة قبل عرض الحل، والتعريف بالمقصد"
  - id: trust
    name: "بناء الثقة والتحويل"
    weeks: [5, 6, 7, 8]
    goal: "تحويل الوعي إلى طلبات تقييم واجتماعات"
  - id: authority
    name: "التخصص والمصداقية"
    weeks: [9, 10, 11, 12]
    goal: "فتح مسار الاستثمار والشراكات المؤسسية"

weeks:
  - week: 1
    theme: "التعريف بالمشكلة"
    audiences: [A1, A2]
    topics:
      - "خمس علامات تدل أن عقارك يُدار بأقل من طاقته"
      - "لماذا يخرج المستأجر الجيد؟ الأسباب الحقيقية غير السعر"
      - "الفرق بين تأجير عقار وتشغيل أصل"
      - "حساب تكلفة شهر الشغور الواحد على إيراد السنة"
  - week: 2
    theme: "التعريف بالمقصد"
    audiences: [A1, A2, A3]
    topics:
      - "من نحن: حل متكامل لإدارة وتشغيل العقارات"
      - "تسع خدمات تحت مظلة واحدة"
      - "قيمنا الخمس وكيف تُترجم إلى قرارات يومية"
      - "لماذا يختار الملاك مُشغّلًا متكاملًا بدل عدة جهات"
  - week: 3
    theme: "الشفافية والأرقام"
    audiences: [A1, A4]
    topics:
      - "ماذا يجب أن يحويه تقرير المالك الشهري"
      - "ثلاثة بنود مصاريف يدفعها الملاك بلا داعٍ"
      - "جولة داخل لوحة Dashboard المالك"
      - "كيف تقرأ تقرير الإيرادات والمصاريف في ثلاث دقائق"
  - week: 4
    theme: "إطلاق عرض التقييم المجاني"
    audiences: [A1, A2, A3]
    topics:
      - "أطلقنا تقرير تقييم أداء العقار — مجانًا"
      - "منهجية حساب فجوة الإيجار مقابل السوق"
      - "ماذا يحوي التقرير المجاني بالضبط"
      - "أسئلة يجيب عنها التقرير قبل أن تتخذ قرارك"
  - week: 5
    theme: "الإدارة المالية والتحصيل"
    audiences: [A1, A2, A4]
    topics:
      - "لماذا يتأخر التحصيل وكيف يُحل نظاميًا"
      - "متى يكون تخفيض الإيجار أفضل من الشغور"
      - "بناء ميزانية تشغيلية واقعية للعقار"
      - "مؤشرات مالية يجب أن يتابعها كل مالك شهريًا"
  - week: 6
    theme: "الجانب القانوني"
    audiences: [A1, A2]
    topics:
      - "أخطاء شائعة في عقود الإيجار التجارية"
      - "حقوق المالك عند إخلال المستأجر نظاميًا"
      - "كيف تحمي نفسك من نزاع طويل قبل توقيع العقد"
      - "ثلاثة بنود في عقدك تحتاج مراجعة اليوم"
  - week: 7
    theme: "الصيانة والتشغيل"
    audiences: [A1, A2]
    topics:
      - "الصيانة الوقائية: تكلفة اليوم مقابل كارثة الغد"
      - "كيف تخفض فاتورة الصيانة السنوية دون خفض الجودة"
      - "قبل وبعد: أثر التجهيز على سرعة التأجير"
      - "كيف يُبنى جدول صيانة سنوي لعقار تجاري"
  - week: 8
    theme: "التسويق واستقطاب المستأجرين"
    audiences: [A1, A2, A3]
    topics:
      - "لماذا لا يُؤجَّر مكتبك؟ أربعة أسباب غير السعر"
      - "أثر التصوير الاحترافي على سرعة التأجير"
      - "استراتيجية التسعير الديناميكي للوحدات"
      - "مزيج المستأجرين وأثره على قيمة المجمع التجاري"
  - week: 9
    theme: "الاستشارات الاستثمارية"
    audiences: [A3, A4]
    topics:
      - "كيف تُقرأ دراسة الجدوى العقارية"
      - "ثلاثة أخطاء يقع فيها المستثمر العقاري الجديد"
      - "مؤشرات تقييم الأصل: العائد والإشغال والنمو"
      - "متى يكون البيع قرارًا أفضل من الاحتفاظ"
  - week: 10
    theme: "التشغيل الفندقي والضيافة"
    audiences: [A3, B3]
    topics:
      - "اقتصاديات التشغيل الفندقي مقابل السكني"
      - "متى يكون تحويل عقارك إلى ضيافة قرارًا صحيحًا"
      - "معايير تجربة الإقامة التي ترفع السعر"
      - "ما الذي يحتاجه المشروع السياحي قبل التشغيل"
  - week: 11
    theme: "شراكات التطوير"
    audiences: [B1, B2, B3]
    topics:
      - "نموذج شراكة: أرضك وخبرتنا"
      - "ماذا نقدّم للمطوّر بعد التسليم"
      - "مسار الشراكة من أول اجتماع إلى التشغيل"
      - "كيف تُقيَّم أرض معطّلة لتحديد أفضل استخدام"
  - week: 12
    theme: "الحصاد والدليل"
    audiences: [A1, A3, A4, B1]
    topics:
      - "ملخص تسعين يومًا بالأرقام"
      - "دراسة حالة: من تقرير مجاني إلى عقد إدارة"
      - "الفريق الذي يقف خلف الأرقام"
      - "ما تعلمناه من تشغيل أكثر من 300 وحدة"

